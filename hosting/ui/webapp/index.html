<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>EstrichONE Hosting-Konsole</title>
    <link rel="icon" href="brand/logo-small.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#0B2D5B" />
    <link rel="stylesheet" href="boot.css" />
    <script src="theme-init.js"></script>
    <script id="sap-ui-bootstrap" src="resources/sap-ui-core.js"
      data-sap-ui-language="de"
      data-sap-ui-async="true"
      data-sap-ui-compat-version="edge"
      data-sap-ui-resource-roots='{"estrichone.hosting": "./"}'
      data-sap-ui-on-init="module:estrichone/hosting/boot"
      data-sap-ui-xx-wait-for-theme="init"></script>
  </head>
  <body class="sapUiBody" id="content">
    <div id="splash" class="splash" role="progressbar" aria-label="Wird geladen">
      <img src="brand/logo.svg" alt="EstrichONE" width="64" height="64" />
      <div class="splash-bar"></div>
    </div>
  </body>
</html>
