specVersion: "4.0"
metadata:
  name: estrichone.hosting
type: application
framework:
  name: OpenUI5
  version: "1.136.22"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.f
    - name: sap.tnt
    - name: sap.uxap
    - name: sap.ui.layout
    - name: sap.ui.unified
    - name: themelib_sap_horizon
    - name: themelib_sap_fiori_3
    - name: themelib_sap_belize
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        omitTSFromBuildResult: true
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /api
      configuration:
        baseUri: "http://localhost:5090/api"
