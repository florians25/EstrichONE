name: Android

on:
  workflow_dispatch: {}
  push:
    branches: ["**", "!dependabot/**"]
    paths: ["android/**", "backend/src/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "backend/src/**", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Kern (Kotlin) gegen echten Server
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # Gradle-Distribution und Abhängigkeiten aus dem Cache (Downloads von GitHub sind zeitweise unzuverlässig).
      - uses: gradle/actions/setup-gradle@v6
      - name: Gradle vorbereiten (mit Wiederholung)
        run: android/scripts/gradle-retry.sh :core:compileTestKotlin
      - name: Tests gegen API und PostgreSQL
        run: android/scripts/test-core-against-server.sh

  app:
    name: App bauen (Compose) und Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: APK bauen und Lint
        run: android/scripts/gradle-retry.sh :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v7
        with:
          name: EstrichONE-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Android-Lint
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

  # Visuelle Prüfung wie bei iOS: Demomodus, Telefon und Tablet, hell und dunkel. JVM ohne Emulator (Roborazzi auf
  # Robolectric mit nativer Grafik); Bilder als Artefakt und base64 im Protokoll (android/scripts/shots-to-log.py).
  screenshots:
    name: Screenshots (Roborazzi, Demomodus)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Screenshots aufnehmen (und App-Unit-Tests)
        run: android/scripts/gradle-retry.sh :app:testDebugUnitTest
      - name: Screenshots sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-screenshots
          path: android/app/build/outputs/roborazzi
          if-no-files-found: warn
          retention-days: 7
      - name: Testbericht sichern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-tests
          path: android/app/build/reports/tests
          retention-days: 7
      # Zuletzt, damit die Bilder am Ende des Protokolls stehen.
      - name: Screenshots ins Protokoll
        if: always()
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/venv/bin/python" android/scripts/shots-to-log.py android/app/build/outputs/roborazzi
