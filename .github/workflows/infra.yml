name: Infrastruktur

# Archivserver, Backup-Ziel, E-Mail und Installer/Update – Ende zu Ende mit den echten Images.
on:
  workflow_dispatch: {}
  push:
    branches: ["**", "!dependabot/**"]
    paths: ["backend/src/**", "docker/**", "deploy/**", "install.sh", "global.json", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["backend/src/**", "docker/**", "deploy/**", "install.sh", "global.json", ".github/workflows/infra.yml"]

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    name: Archiv, Backup-Ziel und E-Mail (Ende zu Ende)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Images bauen
        run: |
          for image in api backup web archive backup-target; do
            docker build -q -f "docker/$image.Dockerfile" -t "estrichone/$image:ci" .
          done
      - name: Shellcheck
        run: |
          shellcheck deploy/archive/test-archive.sh docker/installer/peer.sh docker/installer/kombi.sh deploy/backup-target/test-kombi.sh deploy/backup-target/test-offload.sh deploy/backup-target/test-remote-update.sh docker/installer/update.sh deploy/backup/estrichone-backup deploy/backup/test-installer-restore.sh \
            docker/installer/update-phases.sh docker/installer/test-update-phases.sh deploy/test-update-ablauf.sh
      - name: Update-Ablauf – Phasen-Hilfsskript (verkürzt, ohne Docker)
        run: sh docker/installer/test-update-phases.sh
      - name: Archiv koppeln, archivieren, Unveränderbarkeit, Löschsperre, Export, Backup-Ziel, Testmail
        env:
          ESTRICHONE_VERSION: ci
        run: sudo -E deploy/archive/test-archive.sh

  oneliner:
    name: Ein-Befehl-Installation (install.sh) – Voraussetzungen, frischer Server, Reparatur
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: 1.0.98-ci
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck
        run: shellcheck install.sh
      - name: Voraussetzungen auf frischem Debian und Ubuntu (ohne Docker) – verständliche Meldungen statt Abbruch mitten drin
        run: |
          for os in debian:12 ubuntu:24.04; do
            echo "::group::$os"
            docker run --rm -v "$PWD/install.sh:/install.sh:ro" "$os" bash /install.sh pruefen --domain estrichone.example.org | tee pruefen.log
            grep -q "Docker ist nicht installiert – die Installation bietet das an" pruefen.log
            grep -q "Prüfung beendet" pruefen.log
            ! docker run --rm -v "$PWD/install.sh:/install.sh:ro" "$os" bash /install.sh --ja --domain estrichone.example.org > ohne-docker.log 2>&1
            cat ohne-docker.log
            grep -q "FEHLER: Docker ist nicht installiert." ohne-docker.log
            grep -q -- "--docker-installieren" ohne-docker.log
            ! docker run --rm -u 1000 -v "$PWD/install.sh:/install.sh:ro" "$os" bash /install.sh > ohne-root.log 2>&1
            grep -q "Bitte als root bzw. mit sudo" ohne-root.log
            echo "::endgroup::"
          done
      - name: DNS-Prüfung – NAT (öffentliche Adresse des Routers), falscher Eintrag, offline ohne harten Fehler
        run: |
          check() { docker run --rm --add-host estrichone.example.org:198.51.100.7 "$@" -v "$PWD/install.sh:/install.sh:ro" debian:12 \
            bash /install.sh pruefen --domain estrichone.example.org; }
          # Hinter NAT zeigt der Eintrag auf die öffentliche Adresse – kein Fehlalarm.
          check -e ESTRICHONE_PUBLIC_IP=198.51.100.7 | tee nat.log
          grep -q "öffentliche Adresse dieses Servers" nat.log
          ! grep -q "keine dieser Adressen" nat.log
          # Eintrag zeigt woandershin: Hinweis mit der richtigen Adresse.
          check -e ESTRICHONE_PUBLIC_IP=203.0.113.20 | tee falsch.log
          grep -q "dieser Server ist aber unter 203.0.113.20 erreichbar" falsch.log
          # Ohne Netz (Container ohne Netzwerk) bzw. Dienste nicht erreichbar: kurzer Hinweis, kein Abbruch, keine lange Wartezeit.
          check --network none | tee offline.log
          grep -q "öffentliche Adresse ist nicht ermittelbar" offline.log
          grep -q "Prüfung beendet" offline.log
          echo "198.51.100.7 estrichone.example.org" | sudo tee -a /etc/hosts
          start=$SECONDS
          sudo ESTRICHONE_IP_ECHO_URLS="https://192.0.2.1/ https://192.0.2.2/" bash install.sh pruefen --domain estrichone.example.org | tee offline2.log
          grep -q "öffentliche Adresse ist nicht ermittelbar" offline2.log
          test $((SECONDS - start)) -lt 40
          # Echt hinter NAT: Der Runner hat eine private Adresse; ein Name, der auf seine öffentliche zeigt (sslip.io), gilt als richtig.
          public="$(curl -4 -fsS --max-time 5 https://api.ipify.org || true)"
          if [ -n "$public" ] && getent ahosts "$public.sslip.io" >/dev/null; then
            hostname -I
            sudo bash install.sh pruefen --domain "$public.sslip.io" | tee echt.log
            grep -q "öffentliche Adresse dieses Servers" echt.log
          else
            echo "::notice::Öffentliche Adresse bzw. sslip.io nicht erreichbar – echter NAT-Fall übersprungen"
          fi
      - name: Images dieser Version lokal bauen (Namen wie in der Registry)
        run: |
          for image in api backup web; do
            docker build -q -f "docker/$image.Dockerfile" --build-arg ESTRICHONE_VERSION="$VERSION" -t "ghcr.io/florians25/estrichone-$image:$VERSION" .
          done
          docker build -q -f docker/installer/Dockerfile --build-arg ESTRICHONE_VERSION="$VERSION" -t "ghcr.io/florians25/estrichone-installer:$VERSION" .
      - name: Frischer Server – ein Befehl ohne Rückfragen (Betriebsart direkt auf 80/443, Einrichtungscode am Ende)
        run: |
          sudo bash install.sh --ja --domain localhost --name "Estrichbau CI GmbH" --version "$VERSION" --auto-updates aus 2>&1 | tee install.log
          grep -q "Ports 80/443 sind frei" install.log
          grep -q "^ESTRICHONE_MODE=direkt$" <(sudo cat /opt/estrichone/.env)
          grep -q "^ESTRICHONE_HTTPS_PORT=443$" <(sudo cat /opt/estrichone/.env)
          grep -q "BACKUP-PASSWORT" install.log
          grep -Eq "^   [A-Z0-9]{4}(-[A-Z0-9]{4})+$" install.log
          test -x /opt/estrichone/update.sh
          for _ in $(seq 1 30); do curl -fsSk https://localhost/health/ready && break; sleep 2; done
          curl -fsSk https://localhost/api/v1/server-info | grep -q "\"serverVersion\":\"$VERSION"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = 308
      - name: Erneut ausführen = Reparatur (keine Rückfragen, Daten und Passwörter bleiben)
        run: |
          before="$(sudo grep '^POSTGRES_PASSWORD=' /opt/estrichone/.env)"
          sudo bash install.sh 2>&1 | tee repair.log
          grep -q "Vorhandene Installation" repair.log
          test "$(sudo grep '^POSTGRES_PASSWORD=' /opt/estrichone/.env)" = "$before"
          for _ in $(seq 1 30); do curl -fsSk https://localhost/health/ready && break; sleep 2; done
          sudo bash install.sh pruefen | tee pruefen.log
          grep -q "Port 443: EstrichONE" pruefen.log
          grep -q "Vorhandene Installation: /opt/estrichone (Version $VERSION)" pruefen.log
      - name: Belegter Port wird mit Abhilfe gemeldet (zweite Installation daneben)
        run: |
          sudo mv /opt/estrichone /opt/estrichone-erste
          ! sudo bash install.sh --ja --domain localhost --modus direkt --version "$VERSION" > belegt.log 2>&1
          cat belegt.log
          grep -q "Port 80 ist bereits belegt" belegt.log
          grep -q "sudo ss -ltnp" belegt.log
          sudo mv /opt/estrichone-erste /opt/estrichone
      - name: Vorhandener Caddy (Paket, systemd) – EstrichONE als eigene Site eintragen, vorhandene Site bleibt
        run: |
          (cd /opt/estrichone && sudo docker compose -p estrichone down -v --remove-orphans)
          sudo rm -rf /opt/estrichone
          # Caddy wie auf einem bestehenden Server: aus den Paketquellen; fällt der Spiegel aus, das offizielle Release.
          if ! { sudo apt-get update -qq && sudo apt-get install -y -qq caddy; }; then
            curl -fsSL --retry 3 "https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_linux_amd64.tar.gz" | sudo tar -xz -C /usr/bin caddy
            sudo useradd --system --home /var/lib/caddy --create-home --shell /usr/sbin/nologin caddy || true
            sudo mkdir -p /etc/caddy
            printf '[Service]\nUser=caddy\nExecStart=/usr/bin/caddy run --environ --config /etc/caddy/Caddyfile\nExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --force\nAmbientCapabilities=CAP_NET_BIND_SERVICE\n[Install]\nWantedBy=multi-user.target\n' \
              | sudo tee /etc/systemd/system/caddy.service >/dev/null
            sudo systemctl daemon-reload
          fi
          # Vorhandene Site, die erhalten bleiben muss
          printf ':80 {\n\trespond "Bestehende Website"\n}\n' | sudo tee /etc/caddy/Caddyfile >/dev/null
          sudo systemctl enable --now caddy
          sudo systemctl restart caddy
          systemctl is-active caddy
          sudo bash install.sh --ja --domain estrichone.localhost --name "Caddy CI" --version "$VERSION" --auto-updates aus 2>&1 | tee caddy.log
          grep -q "Ports 80/443 sind belegt" caddy.log
          grep -q "Vorhandener Caddy: Site estrichone.localhost → 127.0.0.1:8181 eingetragen" caddy.log
          grep -q "^ESTRICHONE_MODE=proxy$" <(sudo cat /opt/estrichone/.env)
          sudo cat /etc/caddy/Caddyfile
          test "$(grep -c '^# >>> EstrichONE (estrichone.localhost)' /etc/caddy/Caddyfile)" = 1
          test -f /etc/caddy/Caddyfile.vor-estrichone
          # Suite nur lokal erreichbar, nach außen über den vorhandenen Caddy (internes Zertifikat für *.localhost)
          ss -Hltn | grep -q "127.0.0.1:8181"
          ! ss -Hltn | grep -q "0.0.0.0:8181"
          for _ in $(seq 1 60); do curl -fsSk --resolve estrichone.localhost:443:127.0.0.1 https://estrichone.localhost/health/ready && break; sleep 2; done
          curl -fsSk --resolve estrichone.localhost:443:127.0.0.1 https://estrichone.localhost/api/v1/server-info | grep -q "\"serverVersion\":\"$VERSION"
          curl -fsS http://127.0.0.1/ | grep -q "Bestehende Website"
          # Erneut ausführen = Reparatur: kein zweiter Eintrag
          sudo bash install.sh 2>&1 | tee caddy-repair.log
          test "$(grep -c '^# >>> EstrichONE (estrichone.localhost)' /etc/caddy/Caddyfile)" = 1
      - name: Protokolle bei Fehler
        if: failure()
        run: |
          cd /opt/estrichone && sudo docker compose -p estrichone ps && sudo docker compose -p estrichone logs --tail 80
          sudo journalctl -u caddy --no-pager | tail -n 50 || true

  docker-install:
    name: Docker-Installation auf frischem ${{ matrix.os }} (systemd-Container wie eine VM), dann Installation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ["debian:12", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@v7
      - name: Frischen Server starten (systemd als PID 1, ohne Docker, eigene Datenträger für /var/lib/docker und /var/lib/containerd)
        run: |
          printf 'FROM %s\nENV container=docker DEBIAN_FRONTEND=noninteractive\nRUN for i in 1 2 3; do apt-get update -qq && apt-get install -y -qq --no-install-recommends systemd systemd-sysv dbus ca-certificates curl iproute2 procps && break; sleep 10; done && rm -rf /var/lib/apt/lists/*\nSTOPSIGNAL SIGRTMIN+3\nCMD ["/sbin/init"]\n' \
            "${{ matrix.os }}" | docker build -q -t estrichone-ci/frischer-server -
          docker run -d --name server --hostname server --privileged --cgroupns=private --tmpfs /run --tmpfs /run/lock \
            -v /var/lib/docker -v /var/lib/containerd estrichone-ci/frischer-server
          for _ in $(seq 1 30); do docker exec server systemctl is-system-running 2>/dev/null | grep -Eq 'running|degraded' && break; sleep 1; done
          docker exec server systemctl is-system-running || true
          ! docker exec server sh -c 'command -v docker'
          docker cp install.sh server:/root/install.sh
      - name: Ein Befehl – installiert Docker (get.docker.com) und die neueste veröffentlichte Version
        run: |
          # Neueste Veröffentlichung, deren Installer-Image schon in der Registry liegt (ein frisches Release baut evtl. noch).
          PREVIOUS=""
          for v in $(curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=5" -H "Authorization: Bearer ${{ github.token }}" \
            | grep -o '"tag_name": *"v[^"]*"' | sed 's/.*"v\([^"]*\)"/\1/'); do
            if docker manifest inspect "ghcr.io/florians25/estrichone-installer:$v" >/dev/null 2>&1; then PREVIOUS="$v"; break; fi
          done
          test -n "$PREVIOUS"
          echo "Version: $PREVIOUS"
          docker exec server bash /root/install.sh --ja --docker-installieren --domain localhost --name "Frischer Server CI" \
            --version "$PREVIOUS" --auto-updates aus 2>&1 | tee install.log
          grep -q "Docker wird installiert" install.log
          grep -q "✓ Docker " install.log
          docker exec server systemctl is-active docker
          docker exec server systemctl is-enabled docker
          docker exec server docker compose version
          for _ in $(seq 1 60); do docker exec server curl -fsSk https://localhost/health/ready && break; sleep 2; done
          docker exec server curl -fsSk https://localhost/api/v1/server-info | grep -q "\"serverVersion\":\"$PREVIOUS"
      - name: Erneut prüfen – Docker vorhanden, Installation erkannt
        run: |
          docker exec server bash /root/install.sh pruefen | tee pruefen.log
          grep -q "✓ Docker " pruefen.log
          grep -q "Port 443: EstrichONE" pruefen.log
      - name: Protokolle bei Fehler
        if: failure()
        run: |
          docker exec server cat /tmp/estrichone-docker-install.log || true
          docker exec server journalctl -u docker --no-pager | tail -n 50 || true
          docker exec server sh -c 'cd /opt/estrichone && docker compose -p estrichone ps && docker compose -p estrichone logs --tail 60' || true

  installer:
    name: Installer, Update von der letzten Version, weitere Rechner
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VERSION: 1.0.99-ci
    steps:
      - uses: actions/checkout@v7
      - name: Images dieser Version lokal bauen (Namen wie in der Registry)
        run: |
          # Android-Paket wie im Release (release.yml): APK-Ersatz mit android.json, damit die API es ausliefert.
          head -c 2000000 /dev/urandom > "docker/app-packages/EstrichONE-Android-v$VERSION.apk"
          printf '{"version":"%s","versionCode":19999,"file":"EstrichONE-Android-v%s.apk","sha256":"%s","size":%s,"releaseSigned":true,"signerSha256":"ci"}\n' \
            "$VERSION" "$VERSION" "$(sha256sum "docker/app-packages/EstrichONE-Android-v$VERSION.apk" | cut -d' ' -f1)" \
            "$(stat -c %s "docker/app-packages/EstrichONE-Android-v$VERSION.apk")" > docker/app-packages/android.json
          for image in api backup web archive backup-target; do
            docker build -q -f "docker/$image.Dockerfile" --build-arg ESTRICHONE_VERSION="$VERSION" -t "ghcr.io/florians25/estrichone-$image:$VERSION" .
          done
          docker build -q -f docker/installer/Dockerfile --build-arg ESTRICHONE_VERSION="$VERSION" -t "ghcr.io/florians25/estrichone-installer:$VERSION" .
      - name: Letzte veröffentlichte Version installieren
        run: |
          # Neueste Veröffentlichung, deren Installer-Image schon in der Registry liegt (ein frisches Release baut evtl. noch).
          PREVIOUS=""
          for v in $(curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=5" -H "Authorization: Bearer ${{ github.token }}" \
            | grep -o '"tag_name": *"v[^"]*"' | sed 's/.*"v\([^"]*\)"/\1/'); do
            if docker manifest inspect "ghcr.io/florians25/estrichone-installer:$v" >/dev/null 2>&1; then PREVIOUS="$v"; break; fi
          done
          test -n "$PREVIOUS"
          echo "Ausgangsversion: $PREVIOUS"
          sudo mkdir -p /opt/estrichone
          sudo docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v /opt/estrichone:/opt/estrichone \
            -e ESTRICHONE_MODE=proxy -e ESTRICHONE_DOMAIN=localhost -e ESTRICHONE_NAME="CI" \
            "ghcr.io/florians25/estrichone-installer:$PREVIOUS"
      - name: Automatisches Sicherheitsupdate per update.sh (alte Installation → diese Version, mit Sicherung)
        run: |
          sudo cp docker/installer/update.sh /opt/estrichone/update.sh
          # Release-Feed (Format der GitHub-API) mit dieser Version als Sicherheitsupdate derselben Versionslinie – als reguläres
          # Release, damit auch eine stabile Ausgangsversion (seit 0.1.0) es annimmt (Vorabversionen nur für Vorabinstallationen).
          python3 -c 'import json,sys; json.dump([{"tag_name":"v"+sys.argv[1],"name":"EstrichONE "+sys.argv[1],"draft":False,"prerelease":False,"body":"## Sicherheitsupdate\nCI"}], open("feed.json","w"), indent=2)' "$VERSION"
          export ESTRICHONE_RELEASE_FEED="file://$PWD/feed.json"
          sudo -E /opt/estrichone/update.sh --pruefen | tee check.log
          grep -q "SICHERHEITSUPDATE verfügbar: .* → $VERSION" check.log
          sudo grep -q '"securityUpdate":true' /opt/estrichone/data/backup-status/update.json
          # .env aus der alten Version: nach dem ersten Lauf von update.sh nur noch für root lesbar
          test "$(sudo stat -c %a /opt/estrichone/.env)" = 600
          sudo /opt/estrichone/update.sh --automatik sicherheit 00:00-23:59 | tee setup.log
          systemctl is-enabled estrichone-update.timer
          grep -q "^ESTRICHONE_AUTO_UPDATE=sicherheit$" <(sudo cat /opt/estrichone/.env)
          # Außerhalb des Zeitfensters passiert nichts
          sudo sed -i 's/^ESTRICHONE_AUTO_UPDATE_WINDOW=.*/ESTRICHONE_AUTO_UPDATE_WINDOW=02:00-03:00/' /opt/estrichone/.env
          sudo -E ESTRICHONE_UPDATE_NOW=12:00 /opt/estrichone/update.sh --automatisch | tee wait.log
          grep -q "wartet auf das Zeitfenster" wait.log
          sudo sed -i 's/^ESTRICHONE_AUTO_UPDATE_WINDOW=.*/ESTRICHONE_AUTO_UPDATE_WINDOW=00:00-23:59/' /opt/estrichone/.env
          sudo -E ESTRICHONE_UPDATE_NOW=12:00 /opt/estrichone/update.sh --automatisch | tee update.log
          grep -q "Update erfolgreich" update.log
          grep -q "^ESTRICHONE_VERSION=$VERSION$" <(sudo cat /opt/estrichone/.env)
          curl -fsS http://localhost:8181/api/v1/server-info | grep -q "\"serverVersion\":\"$VERSION"
          sudo cat /opt/estrichone/data/backup-status/update.json
          sudo grep -q '"result":"succeeded"' /opt/estrichone/data/backup-status/update.json
          # Bereits aktuell: kein weiteres Update
          sudo -E ESTRICHONE_UPDATE_NOW=12:00 /opt/estrichone/update.sh --automatisch | tee again.log
          ! grep -q "Automatisches Update" again.log
          sudo /opt/estrichone/update.sh --automatik aus
          ! systemctl is-enabled estrichone-update.timer 2>/dev/null
      - name: App-Updates über den Proxy (Prüfung, APK mit Prüfsumme, fortsetzbarer Download, Mindestversion bleibt erreichbar)
        run: |
          curl -fsS "http://localhost:8181/api/v1/app-updates/check?platform=android&version=1.0.0" | tee check.json
          grep -q '"status":"recommended"' check.json && grep -q "\"latestVersion\":\"$VERSION\"" check.json
          sha="$(sed -n 's/.*"sha256":"\([0-9a-f]*\)".*/\1/p' check.json)"
          curl -fsS -D apk-headers.txt -o app.apk http://localhost:8181/api/v1/app-updates/android/package
          echo "$sha  app.apk" | sha256sum -c -
          grep -qi "^content-type: application/vnd.android.package-archive" apk-headers.txt
          ! grep -qi "^content-encoding:" apk-headers.txt
          # Abgebrochener Download wird fortgesetzt (Range) und ergibt dieselbe Datei.
          head -c 700000 app.apk > teil.apk
          curl -fsS -C - -o teil.apk http://localhost:8181/api/v1/app-updates/android/package
          cmp app.apk teil.apk
          curl -fsS -H "X-EstrichONE-Client: android/0.0.1" http://localhost:8181/api/v1/server-info | grep -q '"serverVersion"'
      - name: Gehärteter Stack nach dem Update (Rechte, Grenzen, nur Caddy mit Ports)
        run: |
          cd /opt/estrichone
          for svc in postgres api backup caddy; do
            id="$(sudo docker compose -p estrichone ps -q "$svc")"
            sudo docker inspect "$id" --format "$svc ro={{.HostConfig.ReadonlyRootfs}} capdrop={{.HostConfig.CapDrop}} pids={{.HostConfig.PidsLimit}} mem={{.HostConfig.Memory}} sec={{.HostConfig.SecurityOpt}}" | tee -a hardening.log
          done
          ! grep -q "ro=false" hardening.log
          grep -c "no-new-privileges:true" hardening.log | grep -qx 4
          for svc in postgres api backup; do
            test -z "$(sudo docker port "$(sudo docker compose -p estrichone ps -q "$svc")")" || { echo "$svc veröffentlicht Ports"; exit 1; }
          done
          # Rate-Limit der Anmelde-/Kopplungspfade (Caddy, 30/min je Adresse) liefert Problem-JSON mit Retry-After.
          # Geprüft am Koppeln (ohne Anmeldung 401), damit die Sperre der API nach Fehlanmeldungen nicht greift.
          for _ in $(seq 1 30); do curl -s -o /dev/null -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:8181/api/v1/archive/pair; done
          curl -s -D headers.txt -o body.json -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:8181/api/v1/archive/pair
          grep -q "^HTTP/1.1 429" headers.txt && grep -qi "^retry-after:" headers.txt && grep -q RATE_LIMITED body.json
          ! grep -qi "^server:" headers.txt
          curl -sI http://localhost:8181/api/v1/server-info | tee info.txt
          ! grep -qi "^server:\|^via:" info.txt
          sleep 61   # Zeitfenster des Rate-Limits ablaufen lassen (folgende Schritte melden sich an)
      - name: Vom Installer abgelegtes update.sh erneut ausführen (idempotent)
        run: |
          ESTRICHONE_UPDATE_ANNOUNCE_SECONDS=2 ESTRICHONE_UPDATE_MIN_SECONDS=2 ESTRICHONE_UPDATE_FINISH_SECONDS=2 \
            sudo -E /opt/estrichone/update.sh --ohne-sicherung "$VERSION" | tee update2.log
          grep -q "Update erfolgreich" update2.log
          grep -q "Phase 3/3" update2.log
      - name: Update-Ablauf Ende zu Ende (Ankündigung, Sperre, Abmeldung, Wartungsstand ohne API, Freigabe; verkürzte Phasen)
        run: sudo -E VERSION="$VERSION" deploy/test-update-ablauf.sh
      - name: Unbekannte Version wird sauber abgelehnt
        run: |
          ! sudo /opt/estrichone/update.sh 9.9.9 2> err.log
          grep -q "gibt es nicht" err.log
      - name: Worst Case – Server weg, Neuinstallation per Installer-Modus restore, Backup-Ziel, das zieht
        run: |
          shellcheck deploy/backup/test-installer-restore.sh
          sudo -E VERSION="$VERSION" deploy/backup/test-installer-restore.sh
      - name: Fernaktualisierung der Zusatzserver – alte Version, Rücksprung bei Fehler, Update mit erhaltenen Daten, Ziel, das zieht
        env:
          OLD_VERSION: 1.0.98-ci
          BROKEN_VERSION: 1.0.98-ci.2
        run: |
          shellcheck deploy/backup-target/test-remote-update.sh
          # Alte Test-Version (gleicher Code, ältere Versionsnummer) und eine Version, deren Container nie gesund wird.
          docker build -q -f docker/backup-target.Dockerfile --build-arg ESTRICHONE_VERSION="$OLD_VERSION" -t "ghcr.io/florians25/estrichone-backup-target:$OLD_VERSION" .
          printf 'FROM ghcr.io/florians25/estrichone-backup-target:%s\nENV ESTRICHONE_ROLE=kaputt\n' "$VERSION" \
            | docker build -q -t "ghcr.io/florians25/estrichone-backup-target:$BROKEN_VERSION" -
          for v in "$OLD_VERSION" "$BROKEN_VERSION"; do
            docker build -q -f docker/installer/Dockerfile --build-arg ESTRICHONE_VERSION="$v" -t "ghcr.io/florians25/estrichone-installer:$v" .
          done
          sudo -E VERSION="$VERSION" deploy/backup-target/test-remote-update.sh
      - name: Kombiserver – Backup-Ziel und Archiv auf einem Rechner, ein Code, Sicherung, Abschließen & Archivieren, Topologie A
        run: |
          shellcheck docker/installer/kombi.sh deploy/backup-target/test-kombi.sh
          sudo -E VERSION="$VERSION" deploy/backup-target/test-kombi.sh
      - name: Speicher-Auslagerung – bestehenden Kombiserver erweitern, auslagern mit Sicherungskopie, Ausfall, Rückholen aus der Sicherung
        run: |
          shellcheck deploy/backup-target/test-offload.sh
          sudo -E VERSION="$VERSION" deploy/backup-target/test-offload.sh
      - name: Archivserver und Backup-Ziel mit einem Befehl (zweimal = Update)
        run: |
          for role in archiv backup-ziel; do
            for run in 1 2; do
              sudo docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "ghcr.io/florians25/estrichone-installer:$VERSION" "$role" | tee "$role.log"
              grep -q "Kopplungscode:" "$role.log"
            done
          done
          docker ps --format '{{.Names}} {{.Status}}'
      - name: Logs bei Fehler
        if: failure()
        run: |
          cd /opt/estrichone && sudo docker compose -p estrichone ps && sudo docker compose -p estrichone logs --tail 80
