name: Infrastruktur

# Archivserver, Backup-Ziel, E-Mail und Installer/Update – Ende zu Ende mit den echten Images.
on:
  workflow_dispatch: {}
  push:
    branches: ["**", "!dependabot/**"]
    paths: ["backend/src/**", "docker/**", "deploy/**", "global.json", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["backend/src/**", "docker/**", "deploy/**", "global.json", ".github/workflows/infra.yml"]

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    name: Archiv, Backup-Ziel und E-Mail (Ende zu Ende)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Images bauen
        run: |
          for image in api backup web archive backup-target; do
            docker build -q -f "docker/$image.Dockerfile" -t "estrichone/$image:ci" .
          done
      - name: Shellcheck
        run: shellcheck deploy/archive/test-archive.sh docker/installer/peer.sh deploy/backup-target/test-remote-update.sh docker/installer/update.sh deploy/backup/estrichone-backup deploy/backup/test-installer-restore.sh
      - name: Archiv koppeln, archivieren, Unveränderbarkeit, Löschsperre, Export, Backup-Ziel, Testmail
        env:
          ESTRICHONE_VERSION: ci
        run: sudo -E deploy/archive/test-archive.sh

  installer:
    name: Installer, Update von der letzten Version, weitere Rechner
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: 0.1.99-ci
    steps:
      - uses: actions/checkout@v5
      - name: Images dieser Version lokal bauen (Namen wie in der Registry)
        run: |
          for image in api backup web archive backup-target; do
            docker build -q -f "docker/$image.Dockerfile" --build-arg ESTRICHONE_VERSION="$VERSION" -t "ghcr.io/florians25/estrichone-$image:$VERSION" .
          done
          docker build -q -f docker/installer/Dockerfile --build-arg ESTRICHONE_VERSION="$VERSION" -t "ghcr.io/florians25/estrichone-installer:$VERSION" .
      - name: Letzte veröffentlichte Version installieren
        run: |
          PREVIOUS="$(curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=5" -H "Authorization: Bearer ${{ github.token }}" \
            | grep -o '"tag_name": *"v[^"]*"' | head -n 1 | sed 's/.*"v\([^"]*\)"/\1/')"
          echo "Ausgangsversion: $PREVIOUS"
          sudo mkdir -p /opt/estrichone
          sudo docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v /opt/estrichone:/opt/estrichone \
            -e ESTRICHONE_MODE=proxy -e ESTRICHONE_DOMAIN=localhost -e ESTRICHONE_NAME="CI" \
            "ghcr.io/florians25/estrichone-installer:$PREVIOUS"
      - name: Automatisches Sicherheitsupdate per update.sh (alte Installation → diese Version, mit Sicherung)
        run: |
          sudo cp docker/installer/update.sh /opt/estrichone/update.sh
          # Release-Feed (Format der GitHub-API) mit dieser Version als Sicherheitsupdate derselben Versionslinie – als reguläres
          # Release, damit auch eine stabile Ausgangsversion (seit 0.1.0) es annimmt (Vorabversionen nur für Vorabinstallationen).
          python3 -c 'import json,sys; json.dump([{"tag_name":"v"+sys.argv[1],"name":"EstrichONE "+sys.argv[1],"draft":False,"prerelease":False,"body":"## Sicherheitsupdate\nCI"}], open("feed.json","w"), indent=2)' "$VERSION"
          export ESTRICHONE_RELEASE_FEED="file://$PWD/feed.json"
          sudo -E /opt/estrichone/update.sh --pruefen | tee check.log
          grep -q "SICHERHEITSUPDATE verfügbar: .* → $VERSION" check.log
          sudo grep -q '"securityUpdate":true' /opt/estrichone/data/backup-status/update.json
          # .env aus der alten Version: nach dem ersten Lauf von update.sh nur noch für root lesbar
          test "$(sudo stat -c %a /opt/estrichone/.env)" = 600
          sudo /opt/estrichone/update.sh --automatik sicherheit 00:00-23:59 | tee setup.log
          systemctl is-enabled estrichone-update.timer
          grep -q "^ESTRICHONE_AUTO_UPDATE=sicherheit$" <(sudo cat /opt/estrichone/.env)
          # Außerhalb des Zeitfensters passiert nichts
          sudo sed -i 's/^ESTRICHONE_AUTO_UPDATE_WINDOW=.*/ESTRICHONE_AUTO_UPDATE_WINDOW=02:00-03:00/' /opt/estrichone/.env
          sudo -E ESTRICHONE_UPDATE_NOW=12:00 /opt/estrichone/update.sh --automatisch | tee wait.log
          grep -q "wartet auf das Zeitfenster" wait.log
          sudo sed -i 's/^ESTRICHONE_AUTO_UPDATE_WINDOW=.*/ESTRICHONE_AUTO_UPDATE_WINDOW=00:00-23:59/' /opt/estrichone/.env
          sudo -E ESTRICHONE_UPDATE_NOW=12:00 /opt/estrichone/update.sh --automatisch | tee update.log
          grep -q "Update erfolgreich" update.log
          grep -q "^ESTRICHONE_VERSION=$VERSION$" <(sudo cat /opt/estrichone/.env)
          curl -fsS http://localhost:8181/api/v1/server-info | grep -q "\"serverVersion\":\"$VERSION"
          sudo cat /opt/estrichone/data/backup-status/update.json
          sudo grep -q '"result":"succeeded"' /opt/estrichone/data/backup-status/update.json
          # Bereits aktuell: kein weiteres Update
          sudo -E ESTRICHONE_UPDATE_NOW=12:00 /opt/estrichone/update.sh --automatisch | tee again.log
          ! grep -q "Automatisches Update" again.log
          sudo /opt/estrichone/update.sh --automatik aus
          ! systemctl is-enabled estrichone-update.timer 2>/dev/null
      - name: Gehärteter Stack nach dem Update (Rechte, Grenzen, nur Caddy mit Ports)
        run: |
          cd /opt/estrichone
          for svc in postgres api backup caddy; do
            id="$(sudo docker compose -p estrichone ps -q "$svc")"
            sudo docker inspect "$id" --format "$svc ro={{.HostConfig.ReadonlyRootfs}} capdrop={{.HostConfig.CapDrop}} pids={{.HostConfig.PidsLimit}} mem={{.HostConfig.Memory}} sec={{.HostConfig.SecurityOpt}}" | tee -a hardening.log
          done
          ! grep -q "ro=false" hardening.log
          grep -c "no-new-privileges:true" hardening.log | grep -qx 4
          for svc in postgres api backup; do
            test -z "$(sudo docker port "$(sudo docker compose -p estrichone ps -q "$svc")")" || { echo "$svc veröffentlicht Ports"; exit 1; }
          done
          # Rate-Limit der Anmelde-/Kopplungspfade (Caddy, 30/min je Adresse) liefert Problem-JSON mit Retry-After.
          # Geprüft am Koppeln (ohne Anmeldung 401), damit die Sperre der API nach Fehlanmeldungen nicht greift.
          for _ in $(seq 1 30); do curl -s -o /dev/null -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:8181/api/v1/archive/pair; done
          curl -s -D headers.txt -o body.json -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:8181/api/v1/archive/pair
          grep -q "^HTTP/1.1 429" headers.txt && grep -qi "^retry-after:" headers.txt && grep -q RATE_LIMITED body.json
          ! grep -qi "^server:" headers.txt
          curl -sI http://localhost:8181/api/v1/server-info | tee info.txt
          ! grep -qi "^server:\|^via:" info.txt
          sleep 61   # Zeitfenster des Rate-Limits ablaufen lassen (folgende Schritte melden sich an)
      - name: Vom Installer abgelegtes update.sh erneut ausführen (idempotent)
        run: |
          sudo /opt/estrichone/update.sh --ohne-sicherung "$VERSION" | tee update2.log
          grep -q "Update erfolgreich" update2.log
      - name: Unbekannte Version wird sauber abgelehnt
        run: |
          ! sudo /opt/estrichone/update.sh 9.9.9 2> err.log
          grep -q "gibt es nicht" err.log
      - name: Worst Case – Server weg, Neuinstallation per Installer-Modus restore, Backup-Ziel, das zieht
        run: |
          shellcheck deploy/backup/test-installer-restore.sh
          sudo -E VERSION="$VERSION" deploy/backup/test-installer-restore.sh
      - name: Fernaktualisierung der Zusatzserver – alte Version, Rücksprung bei Fehler, Update mit erhaltenen Daten, Ziel, das zieht
        env:
          OLD_VERSION: 0.1.98-ci
          BROKEN_VERSION: 0.1.98-ci.2
        run: |
          shellcheck deploy/backup-target/test-remote-update.sh
          # Alte Test-Version (gleicher Code, ältere Versionsnummer) und eine Version, deren Container nie gesund wird.
          docker build -q -f docker/backup-target.Dockerfile --build-arg ESTRICHONE_VERSION="$OLD_VERSION" -t "ghcr.io/florians25/estrichone-backup-target:$OLD_VERSION" .
          printf 'FROM ghcr.io/florians25/estrichone-backup-target:%s\nENV ESTRICHONE_ROLE=kaputt\n' "$VERSION" \
            | docker build -q -t "ghcr.io/florians25/estrichone-backup-target:$BROKEN_VERSION" -
          for v in "$OLD_VERSION" "$BROKEN_VERSION"; do
            docker build -q -f docker/installer/Dockerfile --build-arg ESTRICHONE_VERSION="$v" -t "ghcr.io/florians25/estrichone-installer:$v" .
          done
          sudo -E VERSION="$VERSION" deploy/backup-target/test-remote-update.sh
      - name: Archivserver und Backup-Ziel mit einem Befehl (zweimal = Update)
        run: |
          for role in archiv backup-ziel; do
            for run in 1 2; do
              sudo docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "ghcr.io/florians25/estrichone-installer:$VERSION" "$role" | tee "$role.log"
              grep -q "Kopplungscode:" "$role.log"
            done
          done
          docker ps --format '{{.Names}} {{.Status}}'
      - name: Logs bei Fehler
        if: failure()
        run: |
          cd /opt/estrichone && sudo docker compose -p estrichone ps && sudo docker compose -p estrichone logs --tail 80
