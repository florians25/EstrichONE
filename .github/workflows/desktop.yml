name: Desktop

on:
  workflow_dispatch: {}
  push:
    branches: ["**", "!dependabot/**"]
    paths: ["desktop/**", "backend/src/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "backend/src/**", ".github/workflows/desktop.yml"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client-Bibliothek gegen echten Server (Linux, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Tests
        working-directory: desktop
        run: dotnet test --solution EstrichOne.Desktop.slnx

  windows:
    name: Windows-App bauen und starten (WinUI 3)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: App und Installationsprogramm bauen
        shell: pwsh
        run: pwsh desktop/installer/build.ps1 -Version 0.1.0-ci -Output "$env:RUNNER_TEMP\out"
      - name: Installieren, starten, Bildschirmfoto, deinstallieren
        shell: pwsh
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP\out\EstrichONE-Setup-*.exe" | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/CURRENTUSER', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\EstrichONE\EstrichONE.exe'
          if (-not (Test-Path $exe)) { throw "Nach der Installation fehlt $exe" }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          $process.Refresh()
          if ($process.HasExited) {
            Get-ChildItem "$env:LOCALAPPDATA\EstrichONE\logs" -ErrorAction SilentlyContinue | Get-Content
            Get-WinEvent -LogName Application -MaxEvents 20 | Where-Object { $_.LevelDisplayName -eq 'Error' } | Format-List TimeCreated, ProviderName, Message
            throw "Die installierte App hat sich nach dem Start beendet (Exitcode $($process.ExitCode))."
          }
          "Fenster: '$($process.MainWindowTitle)' Handle $($process.MainWindowHandle)"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save((Join-Path $env:RUNNER_TEMP 'start.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          $process | Stop-Process -Force
          Start-Sleep -Seconds 2
          $uninstaller = Join-Path $env:LOCALAPPDATA 'Programs\EstrichONE\unins000.exe'
          Start-Process $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "Deinstallation hat $exe nicht entfernt" }
          "Installation, Start und Deinstallation in Ordnung."
      - uses: actions/upload-artifact@v4
        with:
          name: EstrichONE-Windows-x64
          path: ${{ runner.temp }}\out
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bildschirmfoto-Windows
          path: ${{ runner.temp }}\start.png
          if-no-files-found: ignore
          retention-days: 7
