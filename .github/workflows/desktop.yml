name: Desktop

on:
  workflow_dispatch: {}
  push:
    branches: ["**", "!dependabot/**"]
    paths: ["desktop/**", "backend/src/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "backend/src/**", ".github/workflows/desktop.yml"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client-Bibliothek gegen echten Server (Linux, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Tests
        working-directory: desktop
        run: dotnet test --solution EstrichOne.Desktop.slnx

  windows:
    name: Windows-App bauen und starten (WinUI 3)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Veröffentlichen (x64, eigenständig)
        working-directory: desktop
        run: dotnet publish src/EstrichOne.Desktop/EstrichOne.Desktop.csproj -c Release -r win-x64 -p:Platform=x64 -o ${{ runner.temp }}\EstrichONE
      - name: Starten und Bildschirmfoto
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'EstrichONE\EstrichONE.exe'
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          $process.Refresh()
          if ($process.HasExited) {
            Get-ChildItem "$env:LOCALAPPDATA\EstrichONE\logs" -ErrorAction SilentlyContinue | Get-Content
            Get-WinEvent -LogName Application -MaxEvents 20 | Where-Object { $_.LevelDisplayName -eq 'Error' } | Format-List TimeCreated, ProviderName, Message
            throw "Die App hat sich nach dem Start beendet (Exitcode $($process.ExitCode))."
          }
          "Fenster: '$($process.MainWindowTitle)' Handle $($process.MainWindowHandle)"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save((Join-Path $env:RUNNER_TEMP 'start.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          # Verkleinert als Text ins Protokoll, damit es ohne Artefakt-Download geprüft werden kann.
          $small = New-Object System.Drawing.Bitmap $bitmap, ([int]($bounds.Width / 2)), ([int]($bounds.Height / 2))
          $stream = New-Object System.IO.MemoryStream
          $small.Save($stream, [System.Drawing.Imaging.ImageFormat]::Jpeg)
          $text = [Convert]::ToBase64String($stream.ToArray())
          "SCREENSHOT-BEGIN"
          for ($i = 0; $i -lt $text.Length; $i += 4000) { $text.Substring($i, [Math]::Min(4000, $text.Length - $i)) }
          "SCREENSHOT-END"
          $process | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        with:
          name: EstrichONE-Windows-x64
          path: ${{ runner.temp }}\EstrichONE
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bildschirmfoto-Windows
          path: ${{ runner.temp }}\start.png
          if-no-files-found: ignore
          retention-days: 7
