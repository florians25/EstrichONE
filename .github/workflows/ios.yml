name: iOS

on:
  workflow_dispatch:
    inputs:
      scenes:
        description: "Screenshots: Bildschirme (kommagetrennt, leer = Standardliste)"
        required: false
        default: ""
      ipad:
        description: "Screenshots auch auf dem iPad"
        type: boolean
        default: true
      appstore:
        description: "App-Store-Screenshots (iPhone 6,9 Zoll und iPad 13 Zoll, volle Auflösung)"
        type: boolean
        default: false
  push:
    branches: ["**", "!dependabot/**"]
    paths: ["ios/**", "contracts/**", "backend/src/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "contracts/**", "backend/src/**", ".github/workflows/ios.yml"]

permissions:
  contents: read

# Laufende Läufe zu Ende führen, nur wartende durch den neuesten ersetzen.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-live:
    name: EstrichCore (Linux, gegen echten Server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Shellcheck
        run: shellcheck ios/scripts/test-core-against-server.sh
      - name: PostgreSQL + API starten, einrichten, swift test
        run: ios/scripts/test-core-against-server.sh

  app:
    name: App bauen und testen (Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Neuestes Xcode wählen
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: EstrichCore testen (macOS)
        working-directory: ios/Packages/EstrichCore
        run: swift test

      - name: Xcode-Projekt erzeugen
        working-directory: ios
        run: xcodegen generate

      - name: Simulator wählen
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-"))
              | {version: (.key | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)") | [(.maj | tonumber), (.min | tonumber)]),
                 devices: [.value[] | select(.name | test("^iPhone"))]}
              | select(.devices | length > 0)]
            | sort_by(.version) | last | .devices[0].udid')
          test -n "$UDID" && test "$UDID" != "null"
          xcrun simctl list devices available | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Nur die Unit-Tests der App; die UI-Tests (EstrichONEUITests) startet man bei Bedarf lokal in Xcode (ios/README.md).
      - name: Build und Unit-Tests (Debug, Simulator)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project EstrichONE.xcodeproj -scheme EstrichONE -only-testing:EstrichONETests \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/EstrichONE.xcresult" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= | tee "$RUNNER_TEMP/xcodebuild-test.log" | grep -E "error:|warning:|Test Case|Test Suite|✔|✘|\*\* TEST" || true
          if ! grep -q "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/xcodebuild-test.log"; then
            echo "::group::Fehlgeschlagene Tests mit Elementbaum"
            sed -n '/: error: -\[/,/^Test Case .* failed/p' "$RUNNER_TEMP/xcodebuild-test.log" | head -n 800
            echo "::endgroup::"
            exit 1
          fi

      - name: Release-Build (Gerät, ohne Signatur)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project EstrichONE.xcodeproj -scheme EstrichONE -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/xcodebuild-release.log" | grep -E "error:|warning:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" "$RUNNER_TEMP/xcodebuild-release.log"

      - name: Ergebnisse sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ergebnisse
          path: |
            ${{ runner.temp }}/EstrichONE.xcresult
            ${{ runner.temp }}/xcodebuild-*.log
          retention-days: 7

  # Visuelle Prüfung: Die App zeigt im Demomodus (Screenshot-Modus, nur Debug-Builds) ihre Bildschirme nacheinander.
  # iPhone (hell und dunkel) und iPad (hell) laufen parallel auf eigenen Runnern – zwei Simulatoren auf einem Runner
  # brauchen wegen knappen Arbeitsspeichers ein Vielfaches. Nur bei Änderungen an der App, parallel zu den Tests.
  screenshots:
    name: Screenshots ${{ matrix.device == 'ipad' && 'iPad' || (matrix.device == 'iphone2' && 'iPhone 2/2' || 'iPhone 1/2') }} (Simulator, Demomodus)
    runs-on: macos-15
    timeout-minutes: 25
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # iPhone in zwei Hälften (Seiten bzw. Formulare, Einrichtung, große Schrift), damit jeder Lauf unter 15 Minuten bleibt.
        device: [iphone, iphone2, ipad]
    env:
      DEVICE: ${{ matrix.device }}
      IPHONE_SCENES: "heute,heute-glocke,heute-unten,baustellen,bauakte,bauakte-mitte,bauakte-unten,bereich-fotos,bereich-aufgaben,bereich-protokolle,protokoll,bereich-tagebuch,bereich-raeume,raum,bereich-basisdaten,bereich-kontakte,bereich-notizen,kunden,kundenkarte,disposition,mehr,sync,wartung,stoerung,chat,chat-verlauf"
      IPHONE_SCENES_2: "erfassen,tagebuch-neu,mangel-neu,basisdaten-neu,neu-1,neu-2,neu-3,neu-4,erstbegehung,abnahme,aufgaben,woche,meldung,meldung-detail,meldung-bearbeitung,kontakt-neu,dispo-zuweisen,dispo-verschieben,dispo-tauschen,dispo-fahrzeug,dispo-kolonnen,dispo-freigabe,postfach,start,start-adresse,anmelden,warten,zuruecksetzen,heute-gross,bauakte-gross,disposition,mehr-zuruecksetzen"
      IPAD_SCENES: "heute,heute-glocke,baustellen,bauakte,bereich-kontakte,kunden,disposition,meldung-detail,anmelden,stoerung,chat-verlauf,wartung,heute-quer,baustellen-quer,bauakte-quer,kunden-quer,disposition-quer,meldung-detail-quer,mehr-zuruecksetzen"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Nur bei Änderungen an der App
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          IPAD_INPUT: ${{ inputs.ipad }}
          SCENES_INPUT: ${{ inputs.scenes }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(ios/EstrichONE/|ios/project\.yml|ios/scripts/|\.github/workflows/ios\.yml)'; then
              run=false
            fi
          fi
          if [ "$DEVICE" = "ipad" ] && [ "$IPAD_INPUT" = "false" ]; then run=false; fi
          # Eigene Liste beim Start von Hand: nur die erste iPhone-Hälfte nimmt sie auf.
          if [ "$DEVICE" = "iphone2" ] && [ -n "$SCENES_INPUT" ]; then run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Screenshots ($DEVICE): $run"

      - name: Xcode wählen, Simulator wählen
        id: sim
        if: steps.changes.outputs.run == 'true'
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          pick() {
            xcrun simctl list devices available --json | jq -r --arg re "$1" '
              [.devices | to_entries[]
                | select(.key | test("SimRuntime\\.iOS-"))
                | {version: (.key | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)") | [(.maj | tonumber), (.min | tonumber)]),
                   devices: [.value[] | select(.name | test($re))]}
                | select(.devices | length > 0)]
              | sort_by(.version) | last | .devices[0].udid // empty'
          }
          if [ "$DEVICE" = "ipad" ]; then
            UDID=$(pick '^iPad Pro 11'); [ -n "$UDID" ] || UDID=$(pick '^iPad Air 11'); [ -n "$UDID" ] || UDID=$(pick '^iPad')
          else
            UDID=$(pick '^iPhone 17 Pro$'); [ -n "$UDID" ] || UDID=$(pick '^iPhone [0-9]+ Pro$'); [ -n "$UDID" ] || UDID=$(pick '^iPhone')
          fi
          test -n "$UDID"
          xcrun simctl list devices available | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Debug-Build für den Simulator
        if: steps.changes.outputs.run == 'true'
        working-directory: ios
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate
          set -o pipefail
          xcodebuild build -project EstrichONE.xcodeproj -scheme EstrichONE -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" "$RUNNER_TEMP/build.log"

      - name: Screenshots aufnehmen
        if: steps.changes.outputs.run == 'true'
        timeout-minutes: 14
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          SCENES_INPUT: ${{ inputs.scenes }}
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/EstrichONE.app"
          # Simulator erst nach dem Build starten (sonst bremst der erste Start den Build stark).
          begin=$SECONDS
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b >/dev/null
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$UDID" "$APP"
          echo "Simulator bereit nach $(( SECONDS - begin )) s"
          case "$DEVICE" in
            ipad) bash ios/scripts/screenshots.sh "$UDID" ipad "$IPAD_SCENES" "$RUNNER_TEMP/shots" 0 ;;
            iphone2) bash ios/scripts/screenshots.sh "$UDID" iphone "$IPHONE_SCENES_2" "$RUNNER_TEMP/shots" 1 ;;
            *) bash ios/scripts/screenshots.sh "$UDID" iphone "${SCENES_INPUT:-$IPHONE_SCENES}" "$RUNNER_TEMP/shots" 1 ;;
          esac
          ls "$RUNNER_TEMP/shots" | wc -l

      - name: Screenshots sichern
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots-${{ matrix.device }}
          path: ${{ runner.temp }}/shots
          retention-days: 7

      # Zuletzt, damit die Bilder am Ende des Protokolls stehen (ios/scripts/shots-to-log.py).
      - name: Screenshots ins Protokoll
        if: always() && steps.changes.outputs.run == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/venv/bin/python" ios/scripts/shots-to-log.py "$RUNNER_TEMP/shots"

  # App-Store-Screenshots in Originalauflösung (hell, Demomodus ohne Kennzeichnung): iPhone 6,9 Zoll (1320 × 2868) und
  # iPad 13 Zoll (2064 × 2752). Nur von Hand (Eingabe „appstore“) oder mit „[appstore]“ in der Commit-Nachricht.
  # Rahmen, Überschriften und die 6,5-Zoll-Fassung entstehen danach mit ImageMagick (ios/AppStore/README.md).
  appstore:
    name: App-Store-Screenshots ${{ matrix.device == 'ipad13' && 'iPad 13"' || 'iPhone 6,9"' }}
    runs-on: macos-15
    timeout-minutes: 25
    if: (github.event_name == 'workflow_dispatch' && inputs.appstore) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[appstore]'))
    strategy:
      fail-fast: false
      matrix:
        device: [iphone69, ipad13]
    env:
      DEVICE: ${{ matrix.device }}
      APPSTORE: "1"
      APPSTORE_SCENES: "heute,bauakte,bereich-fotos,disposition,dispo-zuweisen,erstbegehung,chat-verlauf,kundenkarte,meldung-detail"
    steps:
      - uses: actions/checkout@v5

      - name: Xcode wählen, Simulator wählen
        id: sim
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          pick() {
            xcrun simctl list devices available --json | jq -r --arg re "$1" '
              [.devices | to_entries[]
                | select(.key | test("SimRuntime\\.iOS-"))
                | {version: (.key | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)") | [(.maj | tonumber), (.min | tonumber)]),
                   devices: [.value[] | select(.name | test($re))]}
                | select(.devices | length > 0)]
              | sort_by(.version) | last | .devices[0].udid // empty'
          }
          if [ "$DEVICE" = "ipad13" ]; then
            UDID=$(pick '^iPad Pro 13'); [ -n "$UDID" ] || UDID=$(pick '^iPad Air 13')
          else
            UDID=$(pick '^iPhone 17 Pro Max$'); [ -n "$UDID" ] || UDID=$(pick '^iPhone 16 Pro Max$'); [ -n "$UDID" ] || UDID=$(pick '^iPhone [0-9]+ Pro Max$')
          fi
          test -n "$UDID"
          xcrun simctl list devices available | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Debug-Build für den Simulator
        working-directory: ios
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate
          set -o pipefail
          xcodebuild build -project EstrichONE.xcodeproj -scheme EstrichONE -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= | tee "$RUNNER_TEMP/build.log" | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" "$RUNNER_TEMP/build.log"

      - name: Screenshots aufnehmen
        timeout-minutes: 12
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b >/dev/null
          # System auf Deutsch (Datum in der Statusleiste des iPad), dann neu starten.
          xcrun simctl spawn "$UDID" defaults write "Apple Global Domain" AppleLanguages -array de-DE
          xcrun simctl spawn "$UDID" defaults write "Apple Global Domain" AppleLocale -string de_DE
          xcrun simctl shutdown "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b >/dev/null
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState discharging --batteryLevel 100 --operatorName ""
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/EstrichONE.app"
          # iPad: Vollbild ohne Fenstergriff (iPadOS 26 zeigt sonst unten rechts den Griff zum Ändern der Fenstergröße).
          # Nur dieser Aufnahme-Build – die ausgelieferte App bleibt in Fenstern und Split View nutzbar.
          if [ "$DEVICE" = "ipad13" ]; then
            /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$APP/Info.plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen true" "$APP/Info.plist"
            codesign --force --sign - --preserve-metadata=entitlements "$APP" >/dev/null 2>&1 || true
          fi
          xcrun simctl install "$UDID" "$APP"
          bash ios/scripts/screenshots.sh "$UDID" "$DEVICE" "$APPSTORE_SCENES" "$RUNNER_TEMP/shots" 0
          for f in "$RUNNER_TEMP"/shots/*.png; do sips -g pixelWidth -g pixelHeight "$f" | tail -2 | tr '\n' ' '; echo " $(basename "$f")"; done

      - name: Screenshots sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appstore-${{ matrix.device }}
          path: ${{ runner.temp }}/shots
          retention-days: 30

      # Volle Auflösung als AVIF (Qualität 90) ins Protokoll – Artefakte lassen sich nicht überall laden.
      - name: Screenshots ins Protokoll
        if: always()
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/venv/bin/python" ios/scripts/shots-to-log.py "$RUNNER_TEMP/shots" 4000 4000 90
