name: Release

# Ein Versions-Tag (z. B. v0.1.0 oder v0.1.0-preview.1) legt das Release an und hängt die installierbaren Pakete an:
# Windows-App (ZIP, ohne Installation lauffähig), Android-App (APK), iOS-Xcode-Projekt und das Server-Paket.
# Tags mit Bindestrich werden als Vorabversion veröffentlicht. Versionshinweise: docs/releases/<tag>.md
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Vorhandener Tag"
        required: true

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create:
    name: Release anlegen
    runs-on: ubuntu-latest
    steps:
      # Beim manuellen Start existiert der Tag noch nicht: Release und Tag entstehen auf dem gestarteten Stand.
      - uses: actions/checkout@v7
      - name: Release mit Versionshinweisen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$TAG.md"
          test -f "$notes" || { echo "Versionshinweise $notes fehlen"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
          else
            pre=""; [[ "$TAG" == *-* ]] && pre="--prerelease"
            title="EstrichONE ${TAG#v}"; [[ -n "$pre" ]] && title="EstrichONE ${TAG#v} (Vorabversion)"
            gh release create "$TAG" --title "$title" --notes-file "$notes" $pre --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi

  windows:
    needs: create
    name: Windows-App
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: App und Installationsprogramm bauen und anhängen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pwsh desktop/installer/build.ps1 -Version $env:TAG.TrimStart('v') -Output "$env:RUNNER_TEMP\out"
          Get-ChildItem "$env:RUNNER_TEMP\out" -File | ForEach-Object { gh release upload $env:TAG $_.FullName --clobber --repo $env:GITHUB_REPOSITORY }

  android:
    needs: create
    name: Android-App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: APK bauen
        working-directory: android
        # Testversion mit dem Debug-Schlüssel: direkt installierbar. Für Google Play folgt eine Signatur mit dem
        # Schlüssel des Herausgebers (docs/reengineering/08, Abschnitt 5).
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "EstrichONE-Android-$TAG.apk"
          gh release upload "$TAG" "EstrichONE-Android-$TAG.apk" --clobber --repo "$GITHUB_REPOSITORY"

  server:
    needs: create
    name: Server-Paket
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Paket mit Quellcode und Docker-Compose
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="EstrichONE-Server-$TAG"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" HEAD backend contracts docker deploy web hosting branding global.json README.md
          gh release upload "$TAG" "$name.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"

  ios:
    needs: create
    name: iOS-Xcode-Projekt
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Neuestes Xcode wählen
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Xcode-Projekt erzeugen
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Bauen prüfen (Simulator, ohne Signatur)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project EstrichONE.xcodeproj -scheme EstrichONE -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO | tail -n 5
      - name: Packen und anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="EstrichONE-iOS-Xcode-Projekt-$TAG"
          mkdir -p "$RUNNER_TEMP/$name"
          rsync -a --exclude '.build' --exclude 'build' --exclude 'DerivedData' ios/ "$RUNNER_TEMP/$name/ios/"
          (cd "$RUNNER_TEMP" && zip -qry "$name.zip" "$name")
          gh release upload "$TAG" "$RUNNER_TEMP/$name.zip" --clobber --repo "$GITHUB_REPOSITORY"

  images:
    name: Docker-Images (GitHub Container Registry)
    needs: create
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Bauen und veröffentlichen
        run: |
          version="${TAG#v}"
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          source="org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
          for image in api web backup installer hosting archive backup-target; do
            file="docker/$image.Dockerfile"; [ "$image" = installer ] && file="docker/installer/Dockerfile"; [ "$image" = hosting ] && file="docker/hosting.Dockerfile"
            ref="ghcr.io/$owner/estrichone-$image"
            docker build -f "$file" --build-arg ESTRICHONE_VERSION="$version" --label "$source" \
              --label "org.opencontainers.image.version=$version" -t "$ref:$version" -t "$ref:latest" .
            docker push "$ref:$version"
            docker push "$ref:latest"
          done
