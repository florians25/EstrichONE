name: Release

# Ein Versions-Tag (z. B. v0.1.0 oder v0.1.0-preview.1) legt das Release an und hängt die installierbaren Pakete an:
# Windows-App (ZIP, ohne Installation lauffähig), Android-App (APK), iOS-Xcode-Projekt und das Server-Paket.
# Tags mit Bindestrich werden als Vorabversion veröffentlicht. Versionshinweise: docs/releases/<tag>.md
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Vorhandener Tag"
        required: true

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create:
    name: Release anlegen
    runs-on: ubuntu-24.04
    steps:
      # Beim manuellen Start existiert der Tag noch nicht: Release und Tag entstehen auf dem gestarteten Stand.
      - uses: actions/checkout@v5
      - name: Release mit Versionshinweisen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$TAG.md"
          test -f "$notes" || { echo "Versionshinweise $notes fehlen"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
          else
            pre=""; [[ "$TAG" == *-* ]] && pre="--prerelease"
            title="EstrichONE ${TAG#v}"; [[ -n "$pre" ]] && title="EstrichONE ${TAG#v} (Vorabversion)"
            gh release create "$TAG" --title "$title" --notes-file "$notes" $pre --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
      - name: Benutzerhandbücher (Web, App) anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for art in Web App; do
            pdf="docs/handbuch/EstrichONE-Handbuch-$art.pdf"
            if [[ -f "$pdf" ]]; then
              cp "$pdf" "$RUNNER_TEMP/EstrichONE-Handbuch-$art-$TAG.pdf"
              gh release upload "$TAG" "$RUNNER_TEMP/EstrichONE-Handbuch-$art-$TAG.pdf" --clobber --repo "$GITHUB_REPOSITORY"
            else
              echo "Kein Handbuch unter $pdf – übersprungen."
            fi
          done
      - name: Schulungsmaterial (Kurzanleitungen, Unterlagen) als ZIP anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if compgen -G "docs/schulung/pdf/*.pdf" >/dev/null; then
            name="EstrichONE-Schulung-$TAG"
            mkdir -p "$RUNNER_TEMP/$name"
            cp docs/schulung/pdf/*.pdf "$RUNNER_TEMP/$name/"
            (cd "$RUNNER_TEMP" && zip -qr "$name.zip" "$name")
            gh release upload "$TAG" "$RUNNER_TEMP/$name.zip" --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "Kein Schulungsmaterial unter docs/schulung/pdf – übersprungen."
          fi

  windows:
    needs: create
    name: Windows-App
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: App und Installationsprogramm bauen und anhängen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pwsh desktop/installer/build.ps1 -Version $env:TAG.TrimStart('v') -Output "$env:RUNNER_TEMP\out"
          Get-ChildItem "$env:RUNNER_TEMP\out" -File | ForEach-Object { gh release upload $env:TAG $_.FullName --clobber --repo $env:GITHUB_REPOSITORY }

  android:
    needs: create
    name: Android-App
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Version aus dem Tag (v1.0.5 → versionName 1.0.5, versionCode 10005).
      - name: APK bauen (Testversion, Debug-Schlüssel)
        run: android/scripts/gradle-retry.sh :app:assembleDebug -PappVersionName="${TAG#v}"
      # Signiertes Release-APK nur, wenn der Schlüssel des Herausgebers als Secret hinterlegt ist (nie im Repository).
      - name: Release-APK signieren
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ESTRICHONE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ESTRICHONE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ESTRICHONE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ESTRICHONE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$ESTRICHONE_KEYSTORE_FILE"
          android/scripts/gradle-retry.sh :app:assembleRelease -PappVersionName="${TAG#v}"
          rm -f "$ESTRICHONE_KEYSTORE_FILE"
      - name: Anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -f android/app/build/outputs/apk/release/app-release.apk ]]; then
            # Signiert: Release-APK unter dem gewohnten Namen, Testversion daneben.
            cp android/app/build/outputs/apk/release/app-release.apk "EstrichONE-Android-$TAG.apk"
            cp android/app/build/outputs/apk/debug/app-debug.apk "EstrichONE-Android-$TAG-test.apk"
            files=("EstrichONE-Android-$TAG.apk" "EstrichONE-Android-$TAG-test.apk")
          else
            # Ohne Schlüssel bleibt es beim Debug-APK.
            cp android/app/build/outputs/apk/debug/app-debug.apk "EstrichONE-Android-$TAG.apk"
            files=("EstrichONE-Android-$TAG.apk")
          fi
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  server:
    needs: create
    name: Server-Paket
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Paket mit Quellcode und Docker-Compose
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="EstrichONE-Server-$TAG"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" HEAD backend contracts docker deploy web hosting branding global.json README.md
          gh release upload "$TAG" "$name.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"

  ios:
    needs: create
    name: iOS-Xcode-Projekt
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Neuestes Xcode wählen
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Xcode-Projekt erzeugen
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Bauen prüfen (Simulator, ohne Signatur)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project EstrichONE.xcodeproj -scheme EstrichONE -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO | tail -n 5
      - name: Packen und anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="EstrichONE-iOS-Xcode-Projekt-$TAG"
          mkdir -p "$RUNNER_TEMP/$name"
          rsync -a --exclude '.build' --exclude 'build' --exclude 'DerivedData' ios/ "$RUNNER_TEMP/$name/ios/"
          (cd "$RUNNER_TEMP" && zip -qry "$name.zip" "$name")
          gh release upload "$TAG" "$RUNNER_TEMP/$name.zip" --clobber --repo "$GITHUB_REPOSITORY"

  images:
    name: Docker-Images (GitHub Container Registry)
    needs: create
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Bauen und veröffentlichen
        run: |
          version="${TAG#v}"
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          source="org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
          for image in api web backup installer hosting archive backup-target; do
            file="docker/$image.Dockerfile"; [ "$image" = installer ] && file="docker/installer/Dockerfile"; [ "$image" = hosting ] && file="docker/hosting.Dockerfile"
            ref="ghcr.io/$owner/estrichone-$image"
            docker build -f "$file" --build-arg ESTRICHONE_VERSION="$version" --label "$source" \
              --label "org.opencontainers.image.version=$version" -t "$ref:$version" -t "$ref:latest" .
            docker push "$ref:$version"
            docker push "$ref:latest"
          done
