name: Rechtsseiten

# Mini-Image mit Impressum, Datenschutz und Support (legal/) – Support- und Datenschutz-URL für den App Store.
on:
  push:
    branches: [main]
    paths: ['legal/**', '.github/workflows/legal.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Image bauen und veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Bauen, prüfen, veröffentlichen
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          ref="ghcr.io/$owner/estrichone-legal"
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$ref:latest" legal
          docker run -d --name legal -p 8080:8080 "$ref:latest"
          for p in / /impressum /datenschutz /support; do
            for i in $(seq 1 20); do curl -fsS -o /dev/null "http://127.0.0.1:8080$p" && break; sleep 1; done
            curl -fsS -o /dev/null "http://127.0.0.1:8080$p"
          done
          docker push "$ref:latest"
