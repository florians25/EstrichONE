name: Backend

on:
  schedule:
    - cron: "17 2 * * *"   # nächtlich: u. a. Backup/Restore-Test gegen aktuelle Basis-Images
  workflow_dispatch: {}
  push:
    branches: [main, "claude/**"]
    paths: ["backend/**", "contracts/**", "docker/**", "deploy/**", "global.json", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "contracts/**", "docker/**", "deploy/**", "global.json", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build und Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Wiederherstellen
        run: dotnet restore backend/EstrichOne.slnx
      - name: Bauen (Warnungen sind Fehler)
        run: dotnet build backend/EstrichOne.slnx --configuration Release --no-restore
      - name: Tests (PostgreSQL per Testcontainers)
        run: dotnet test --solution backend/EstrichOne.slnx --configuration Release --no-build
      - name: Schwachstellen in Abhängigkeiten
        run: |
          dotnet list backend/EstrichOne.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

  container:
    name: Container und Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Images bauen
        run: |
          docker build -f docker/api.Dockerfile -t estrichone/api:ci .
          docker build -f docker/backup.Dockerfile -t estrichone/backup:ci .
      - name: Compose-Datei prüfen
        working-directory: deploy
        run: POSTGRES_PASSWORD=ci RESTIC_PASSWORD=ci docker compose config --quiet
      - name: Shellcheck
        run: shellcheck deploy/*.sh deploy/backup/*
      - name: Stack starten und server-info abrufen
        working-directory: deploy
        run: |
          ./setup.sh --domain localhost --name "CI" --yes
          ESTRICHONE_VERSION=ci docker compose up -d --no-build --wait --wait-timeout 180
          docker compose exec -T caddy cat /data/caddy/pki/authorities/local/root.crt > caddy-root.crt
          curl --fail --cacert caddy-root.crt https://localhost/api/v1/server-info
      - name: Logs bei Fehler
        if: failure()
        working-directory: deploy
        run: docker compose logs

  backup-restore:
    name: Backup und Wiederherstellung (Ende zu Ende)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Images bauen
        run: |
          docker build -f docker/api.Dockerfile -t estrichone/api:ci .
          docker build -f docker/backup.Dockerfile -t estrichone/backup:ci .
      - name: Shellcheck
        run: shellcheck deploy/backup/estrichone-backup deploy/backup/test-backup-restore.sh
      - name: Sichern, Totalverlust, Wiederherstellen, Prüfen
        env:
          ESTRICHONE_VERSION: ci
        run: deploy/backup/test-backup-restore.sh
