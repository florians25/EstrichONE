name: Backend

on:
  schedule:
    - cron: "17 2 * * *"   # nächtlich: u. a. Backup/Restore-Test gegen aktuelle Basis-Images
  workflow_dispatch: {}
  push:
    branches: ["**", "!dependabot/**"]
    paths: ["backend/**", "contracts/**", "docker/**", "deploy/**", "web/**", "global.json", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "contracts/**", "docker/**", "deploy/**", "web/**", "global.json", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build und Tests
    runs-on: ubuntu-24.04
    # Tests allein ~16–20 min (je Testklasse eine eigene Datenbank, Zugriffstest über alle Routen).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Wiederherstellen
        run: dotnet restore backend/EstrichOne.slnx
      - name: Bauen (Warnungen sind Fehler)
        run: dotnet build backend/EstrichOne.slnx --configuration Release --no-restore
      - name: Tests (PostgreSQL per Testcontainers)
        run: dotnet test --solution backend/EstrichOne.slnx --configuration Release --no-build
      - name: Schwachstellen in Abhängigkeiten
        run: |
          dotnet list backend/EstrichOne.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

  container:
    name: Container und Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Images bauen
        run: |
          docker build -f docker/api.Dockerfile -t estrichone/api:ci .
          docker build -f docker/backup.Dockerfile -t estrichone/backup:ci .
          docker build -f docker/web.Dockerfile -t estrichone/web:ci .
      - name: Compose-Datei prüfen
        working-directory: deploy
        run: |
          POSTGRES_PASSWORD=ci RESTIC_PASSWORD=ci docker compose config --quiet
          POSTGRES_PASSWORD=ci RESTIC_PASSWORD=ci docker compose -f compose.yml -f compose.proxy.yml config --quiet
          # Eine Liste vertrauenswürdiger Proxys für Caddy und API (docs/sicherheit.md, Betrieb)
          config="$(POSTGRES_PASSWORD=ci RESTIC_PASSWORD=ci ESTRICHONE_TRUSTED_PROXIES='private_ranges 203.0.113.5' \
            docker compose -f compose.yml -f compose.proxy.yml config --format json)"
          echo "$config" | jq -e '.services.api.environment.EstrichOne__TrustedProxies == "private_ranges 203.0.113.5"
            and .services.caddy.environment.ESTRICHONE_TRUSTED_PROXIES == "private_ranges 203.0.113.5"'
          POSTGRES_PASSWORD=ci RESTIC_PASSWORD=ci docker compose -f compose.yml -f compose.proxy.yml config --format json \
            | jq -e '.services.caddy.environment.ESTRICHONE_TRUSTED_PROXIES == "private_ranges" and .services.api.environment.EstrichOne__TrustedProxies == ""'
      - name: Shellcheck
        run: shellcheck deploy/*.sh deploy/backup/*
      - name: Stack starten und server-info abrufen
        working-directory: deploy
        run: |
          sudo ./setup.sh --domain localhost --name "CI" --yes
          sudo chmod 644 .env   # nur in der CI: Compose läuft ohne root und muss .env lesen
          ESTRICHONE_VERSION=ci docker compose up -d --no-build --wait --wait-timeout 180
          docker compose exec -T caddy cat /data/caddy/pki/authorities/local/root.crt > caddy-root.crt
          curl --fail --cacert caddy-root.crt https://localhost/api/v1/server-info
          # Weboberfläche: Startseite, Routen der App (index.html) und Sicherheitsheader
          curl --fail --cacert caddy-root.crt -s https://localhost/ | grep -q 'id="sap-ui-bootstrap"'
          curl --fail --cacert caddy-root.crt -s https://localhost/verwaltung/benutzer | grep -q 'id="sap-ui-bootstrap"'
          curl --fail --cacert caddy-root.crt -sI https://localhost/ | grep -qi "content-security-policy: default-src 'self'"
      - name: Logs bei Fehler
        if: failure()
        working-directory: deploy
        run: docker compose logs

  backup-restore:
    name: Backup und Wiederherstellung (Ende zu Ende)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Images bauen
        run: |
          docker build -f docker/api.Dockerfile -t estrichone/api:ci .
          docker build -f docker/backup.Dockerfile -t estrichone/backup:ci .
          docker build -f docker/web.Dockerfile -t estrichone/web:ci .
      - name: Shellcheck
        run: shellcheck deploy/backup/estrichone-backup deploy/backup/test-backup-restore.sh
      - name: Sichern, Totalverlust, Wiederherstellen, Prüfen
        env:
          ESTRICHONE_VERSION: ci
        run: sudo -E deploy/backup/test-backup-restore.sh
