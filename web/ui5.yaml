specVersion: "4.0"
metadata:
  name: estrichone.web
type: application
framework:
  name: OpenUI5
  version: "1.136.22"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.f
    - name: sap.tnt
    - name: sap.uxap
    - name: sap.ui.layout
    - name: sap.ui.unified
    - name: themelib_sap_horizon
    - name: themelib_sap_fiori_3
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        omitTSFromBuildResult: true
    - name: ui5-tooling-modules-task
      afterTask: ui5-tooling-transpile-task
      configuration:
        addToNamespace: true
server:
  customMiddleware:
    - name: spa-fallback
      beforeMiddleware: serveResources
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
    - name: ui5-tooling-modules-middleware
      afterMiddleware: ui5-tooling-transpile-middleware
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /api
      configuration:
        baseUri: "http://localhost:5080/api"
---
# Entwicklung: unbekannte Pfade (Deep-Links wie /bauakten/…) liefern index.html, wie Caddy im Betrieb.
specVersion: "4.0"
kind: extension
type: server-middleware
metadata:
  name: spa-fallback
middleware:
  path: scripts/spa-fallback.cjs
