# EstrichONE – Self-Hosting
#   Einrichtung:  ./setup.sh
#   Start:        docker compose up -d --build
# Nur Caddy öffnet Ports nach außen. Datenbank und API sind ausschließlich intern erreichbar.

name: estrichone

x-api-image: &api-image
  image: estrichone/api:${ESTRICHONE_VERSION:-dev}
  build:
    context: ..
    dockerfile: docker/api.Dockerfile
    args:
      ESTRICHONE_VERSION: ${ESTRICHONE_VERSION:-0.1.0}

x-web-image: &web-image
  image: estrichone/web:${ESTRICHONE_VERSION:-dev}
  build:
    context: ..
    dockerfile: docker/web.Dockerfile

x-database: &database
  ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-estrichone};Username=${POSTGRES_USER:-estrichone};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt – bitte ./setup.sh ausführen};Gss Encryption Mode=Disable

x-backup-image: &backup-image
  image: estrichone/backup:${ESTRICHONE_VERSION:-dev}
  build:
    context: ..
    dockerfile: docker/backup.Dockerfile

x-archive-image: &archive-image
  image: estrichone/archive:${ESTRICHONE_VERSION:-dev}
  build:
    context: ..
    dockerfile: docker/archive.Dockerfile

x-backup-environment: &backup-environment
  PGHOST: postgres
  PGDATABASE: ${POSTGRES_DB:-estrichone}
  PGUSER: ${POSTGRES_USER:-estrichone}
  PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt – bitte ./setup.sh ausführen}
  RESTIC_PASSWORD: ${RESTIC_PASSWORD:?RESTIC_PASSWORD fehlt – bitte ./setup.sh ausführen}
  RESTIC_CACHE_DIR: /cache
  BACKUP_REPOSITORY: ${BACKUP_REPOSITORY:-/repository}
  BACKUP_REPOSITORY_2: ${BACKUP_REPOSITORY_2:-}
  BACKUP_TIME: ${BACKUP_TIME:-22:30}

# Härtung (docs/sicherheit.md, Betrieb): Dateisystem schreibgeschützt (nur Volumes und /tmp beschreibbar), keine
# Capabilities, kein Rechtegewinn über setuid, Prozessgrenze gegen Fork-Bomben, Protokolle rotiert (Platte läuft nicht voll).
# Speichergrenzen sind großzügig und über die .env anpassbar (ESTRICHONE_MEMORY_<DIENST>, z. B. ESTRICHONE_MEMORY_API=8g).
# Kein Dienst bekommt den Docker-Socket – nur der Installer/update.sh (einmalig, auf Aufruf von root) braucht ihn.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  pids_limit: 2048
  <<: *logging

services:
  postgres:
    # Version und Digest fest (Dependabot schlägt Aktualisierungen vor; Nebenversionen 17.x sind datenkompatibel).
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    <<: *logging
    # Der Einstieg des Images läuft kurz als root (Rechte am Datenverzeichnis), dann als Benutzer postgres:
    # nur die dafür nötigen Capabilities, Dateisystem schreibgeschützt bis auf Daten, Socket und /tmp.
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    pids_limit: 1024
    mem_limit: ${ESTRICHONE_MEMORY_POSTGRES:-4g}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-estrichone}
      POSTGRES_USER: ${POSTGRES_USER:-estrichone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt – bitte ./setup.sh ausführen}
    volumes:
      - ${ESTRICHONE_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 128mb
    networks: [backend]

  api:
    <<: [*api-image, *hardening]
    restart: unless-stopped
    mem_limit: ${ESTRICHONE_MEMORY_API:-6g}
    environment:
      <<: *database
      EstrichOne__ServerName: ${ESTRICHONE_SERVER_NAME:-EstrichONE}
      EstrichOne__PublicUrl: ${ESTRICHONE_PUBLIC_URL:-https://${ESTRICHONE_DOMAIN:-localhost}}
      EstrichOne__TrustForwardedHeaders: "true"
      # Dieselbe Liste wie für Caddy: Adressen vorgeschalteter Proxys mit öffentlicher IP (private Netze vertraut die API
      # immer). Nur von ihnen übernimmt die API die Client-Adresse aus X-Forwarded-For (Sperre/Rate-Limit je IP).
      EstrichOne__TrustedProxies: ${ESTRICHONE_TRUSTED_PROXIES:-}
      # Datenbankschema beim Start aktualisieren (ersetzt den früheren Dienst „migrate“, ADR 0003).
      EstrichOne__MigrateOnStartup: "true"
      EstrichOne__Backup__StatusPath: /status
      # Notfallblatt (Backup Center → Notfall) und Backup-Ziele, die ziehen (docs/backup.md)
      EstrichOne__Backup__RepositoryPassword: ${RESTIC_PASSWORD:?RESTIC_PASSWORD fehlt – bitte ./setup.sh ausführen}
      EstrichOne__Backup__Repository: ${BACKUP_REPOSITORY:-/repository}
      EstrichOne__Backup__Repository2: ${BACKUP_REPOSITORY_2:-}
      EstrichOne__Backup__HostBackupDir: ${ESTRICHONE_BACKUP_DIR:-./backup-repository}
      EstrichOne__Backup__RepositoryPath: /repository
      EstrichOne__Backup__InstallerImage: ${ESTRICHONE_REGISTRY:-ghcr.io/florians25}/estrichone-installer
      # Pushnachrichten an iOS (APNs, docs/benachrichtigungen.md) – alternativ in Einstellungen → Benachrichtigungen.
      EstrichOne__Push__VapidSubject: ${ESTRICHONE_PUSH_CONTACT:-}
      EstrichOne__Push__ApnsKeyId: ${ESTRICHONE_APNS_KEY_ID:-HT48M8LMF3}
      EstrichOne__Push__ApnsTeamId: ${ESTRICHONE_APNS_TEAM_ID:-9GVGJKZ9H5}
      EstrichOne__Push__ApnsBundleId: ${ESTRICHONE_APNS_BUNDLE_ID:-de.estrichone.EstrichONE}
      EstrichOne__Push__ApnsKeyPath: ${ESTRICHONE_APNS_KEY_PATH:-}
      EstrichOne__Push__ApnsProduction: ${ESTRICHONE_APNS_PRODUCTION:-true}
    volumes:
      - ${ESTRICHONE_DATA_DIR:-./data}/files:/data/files
      - ${ESTRICHONE_DATA_DIR:-./data}/backup-status:/status
      # Nur lesend: Quelle für Backup-Ziele, die vom Server ziehen (verschlüsselt, Zugriff nur mit Spiegel-Token)
      - ${ESTRICHONE_BACKUP_DIR:-./backup-repository}:/repository:ro
    # Erster Start mit Schema-Update kann dauern.
    healthcheck:
      test: ["CMD", "dotnet", "EstrichOne.Api.dll", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, frontend]

  # Tägliche Vollsicherung (Datenbank, Dateien/Fotos/Dokumente/Videos, Schlüssel, Konfiguration) mit restic, optional
  # zusätzlich inkrementell; Status, Zeitplan und Wiederherstellung über das Backup Center (docs/backup.md).
  # Dateien schreibbar, damit „Wiederherstellen“ im Backup Center ohne Konsole funktioniert.
  backup:
    <<: [*backup-image, *hardening]
    restart: unless-stopped
    mem_limit: ${ESTRICHONE_MEMORY_BACKUP:-4g}
    environment:
      <<: *backup-environment
    volumes:
      - ${ESTRICHONE_DATA_DIR:-./data}/files:/data/files
      - ${ESTRICHONE_DATA_DIR:-./data}/config:/config:ro
      - ${ESTRICHONE_DATA_DIR:-./data}/backup-status:/status
      - ${ESTRICHONE_DATA_DIR:-./data}/backup-staging:/tmp/estrichone-backup
      - ${ESTRICHONE_DATA_DIR:-./data}/restic-cache:/cache
      - ${ESTRICHONE_BACKUP_DIR:-./backup-repository}:/repository
      - ${ESTRICHONE_SSH_DIR:-./ssh}:/home/backup/.ssh:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [backend, frontend]

  # Wiederherstellung von der Konsole (Neuinstallation: Installer-Modus „restore“, docs/backup.md):
  #   docker compose stop api && docker compose --profile restore run --rm restore [snapshot]
  restore:
    <<: [*backup-image, *hardening]
    profiles: [restore]
    entrypoint: ["estrichone-backup", "restore"]
    command: ["latest"]
    environment:
      <<: *backup-environment
      ESTRICHONE_RESTORE_MODE: "1"
    volumes:
      - ${ESTRICHONE_DATA_DIR:-./data}/files:/data/files
      - ${ESTRICHONE_DATA_DIR:-./data}/backup-status:/status
      - ${ESTRICHONE_DATA_DIR:-./data}/backup-staging:/tmp/estrichone-backup
      - ${ESTRICHONE_DATA_DIR:-./data}/restic-cache:/cache
      - ${ESTRICHONE_BACKUP_DIR:-./backup-repository}:/repository
      - ${ESTRICHONE_SSH_DIR:-./ssh}:/home/backup/.ssh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, frontend]

  # Archivserver im selben Stack – nur, wenn kein zweiter Rechner zur Verfügung steht (besser: eigener Rechner,
  # siehe deploy/archive/README.md). Einschalten: COMPOSE_PROFILES=archive in der .env bzw. Installer mit
  # -e ESTRICHONE_ARCHIVE=lokal. Koppeln in EstrichONE mit Adresse „archive“ und dem Code aus „docker compose logs archive“.
  archive:
    <<: [*archive-image, *hardening]
    profiles: [archive]
    restart: unless-stopped
    mem_limit: ${ESTRICHONE_MEMORY_ARCHIVE:-2g}
    environment:
      ESTRICHONE_NAME: Archiv (im EstrichONE-Stack)
      ESTRICHONE_ADDRESS: archive
    volumes:
      - ${ESTRICHONE_ARCHIVE_DIR:-./archive}:/data
    networks: [frontend]

  caddy:
    <<: [*web-image, *hardening]
    restart: unless-stopped
    # Einziger Dienst mit Ports nach außen; braucht nur das Recht, Ports unter 1024 zu öffnen.
    cap_add: [NET_BIND_SERVICE]
    mem_limit: ${ESTRICHONE_MEMORY_CADDY:-1g}
    # Caddy lauscht im Container auf denselben Ports wie außen, damit Weiterleitungen den richtigen Port nennen.
    # ESTRICHONE_BIND (mit Doppelpunkt am Ende, z. B. „192.168.1.10:“) bindet nur an diese Adresse des Servers.
    # Achtung: von Docker veröffentlichte Ports umgehen ufw/iptables-INPUT-Regeln (docs/sicherheit.md, Checkliste).
    ports:
      - "${ESTRICHONE_BIND:-}${ESTRICHONE_HTTP_PORT:-80}:${ESTRICHONE_HTTP_PORT:-80}"
      - "${ESTRICHONE_BIND:-}${ESTRICHONE_HTTPS_PORT:-443}:${ESTRICHONE_HTTPS_PORT:-443}"
      - "${ESTRICHONE_BIND:-}${ESTRICHONE_HTTPS_PORT:-443}:${ESTRICHONE_HTTPS_PORT:-443}/udp"
    environment:
      ESTRICHONE_DOMAIN: ${ESTRICHONE_DOMAIN:-localhost}
      ESTRICHONE_HTTP_PORT: ${ESTRICHONE_HTTP_PORT:-80}
      ESTRICHONE_HTTPS_PORT: ${ESTRICHONE_HTTPS_PORT:-443}
      # direkt = Caddy macht HTTPS selbst; proxy = nur HTTP hinter einem vorhandenen Reverse Proxy (compose.proxy.yml)
      ESTRICHONE_MODE: ${ESTRICHONE_MODE:-direkt}
      ESTRICHONE_TRUSTED_PROXIES: ${ESTRICHONE_TRUSTED_PROXIES:-127.0.0.1/32}
      # Rate-Limits je Client-Adresse und Minute (deploy/Caddyfile)
      ESTRICHONE_RATE_LOGIN: ${ESTRICHONE_RATE_LOGIN:-30}
      ESTRICHONE_RATE_SESSION: ${ESTRICHONE_RATE_SESSION:-300}
      ESTRICHONE_RATE_API: ${ESTRICHONE_RATE_API:-3000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${ESTRICHONE_DATA_DIR:-./data}/caddy/data:/data
      - ${ESTRICHONE_DATA_DIR:-./data}/caddy/config:/config
      # Nur lesend: Stand des Update-Ablaufs (/update-status.json), damit die Wartungsseite ohne API weiterläuft
      - ${ESTRICHONE_DATA_DIR:-./data}/backup-status:/status:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]

networks:
  # Kein Internetzugang für Datenbank und Migration.
  backend:
    internal: true
  frontend: {}
