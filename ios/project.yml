# Projektbeschreibung für XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Das Xcode-Projekt wird daraus erzeugt und nicht eingecheckt: `xcodegen generate` im Ordner ios/.
name: EstrichONE
options:
  bundleIdPrefix: de.estrichone
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    # Simulator ohne Entwicklerkonto: lokal signieren, damit der Schlüsselbund nutzbar ist.
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  EstrichCore:
    path: Packages/EstrichCore
targets:
  EstrichONE:
    type: application
    platform: iOS
    sources:
      - path: EstrichONE
        excludes:
          - "Config/*.plist"
    dependencies:
      - package: EstrichCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.estrichone.EstrichONE
        PRODUCT_NAME: EstrichONE
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: EstrichONE
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Die Kamera wird für Baustellenfotos, zum Scannen von Dokumenten (Lieferscheine, Pläne, Abnahmen) und des Einrichtungscodes verwendet."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Der Standort wird nur auf Knopfdruck verwendet, um die Adresse einer neuen Baustelle oder den Aufnahmeort eines Fotos zu übernehmen."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Nur Debug-Builds erlauben unverschlüsselte Verbindungen zu lokalen Testservern (10, Abschnitt 4).
        Debug:
          INFOPLIST_FILE: EstrichONE/Config/Info-Debug.plist
        Release:
          INFOPLIST_FILE: EstrichONE/Config/Info.plist
  EstrichONETests:
    type: bundle.unit-test
    platform: iOS
    sources: [EstrichONETests]
    dependencies:
      - target: EstrichONE
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.estrichone.EstrichONETests
  EstrichONEUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [EstrichONEUITests]
    dependencies:
      - target: EstrichONE
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.estrichone.EstrichONEUITests
        TEST_TARGET_NAME: EstrichONE
schemes:
  EstrichONE:
    build:
      targets:
        EstrichONE: all
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - EstrichONETests
        - EstrichONEUITests
